<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=yes">
<title>FUTURE BIOTECH 文件系统</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="loginView" class="center-shell">
  <div class="login-card">
    <div class="brand">FUTURE BIOTECH</div>
    <h1>文件系统 / Документы</h1>
    <form id="loginForm">
      <label>个人编号 / Личный ID<input id="loginId" autocomplete="username" required></label>
      <label>密码 / Пароль<input id="password" type="password" autocomplete="current-password" required></label>
      <button class="primary" type="submit">登录 / Войти</button>
    </form>
    <div id="loginError" class="error hidden"></div>
  </div>
</div>

<div id="appView" class="app hidden">
  <header class="topbar">
    <div><strong>FUTURE BIOTECH</strong><div id="who" class="muted"></div></div>
    <div class="top-actions">
      <button id="toggleLang" class="ghost">中 / RU</button>
      <button id="logoutBtn" class="ghost">退出</button>
    </div>
  </header>

  <main>
    <section id="userHome" class="panel">
      <div class="section-head">
        <div><h2 id="myDocsTitle">我的文件</h2><p id="myDocsHint" class="muted">只显示分配给您的文件。</p></div>
      </div>
      <div id="userDocs" class="grid"></div>
      <div id="userEmpty" class="empty hidden">目前没有文件。</div>
    </section>

    <section id="adminHome" class="hidden">
      <nav class="admin-tabs">
        <button data-tab="templates" class="active">模板</button>
        <button data-tab="documents">文件</button>
        <button data-tab="users">账户</button>
      </nav>

      <section id="tab-templates" class="panel admin-tab">
        <div class="section-head">
          <div><h2>原始模板</h2><p class="muted">把您原来的 4 个源代码文件导入这里。导入后源代码保存在 Supabase，不会公开放在 GitHub。</p></div>
        </div>
        <div id="templateList"></div>
      </section>

      <section id="tab-documents" class="panel admin-tab hidden">
        <div class="section-head">
          <div><h2>文件管理</h2><p class="muted">创建、复制、发放、收回或删除文件。</p></div>
          <button id="newDocBtn" class="primary">＋ 新建文件</button>
        </div>
        <div id="adminDocs"></div>
      </section>

      <section id="tab-users" class="panel admin-tab hidden">
        <div class="section-head">
          <div><h2>账户</h2><p class="muted">管理员可查看账户及每个账户收到的文件。</p></div>
        </div>
        <div class="notice">当前版本的账户“创建/改密码”仍通过 Supabase Authentication 完成；文件发放、收回、复制、删除已经在本系统内完成。</div>
        <div id="userList"></div>
      </section>
    </section>
  </main>
</div>

<dialog id="docDialog">
  <form method="dialog" class="dialog-card" id="docForm">
    <div class="dialog-head"><h3>新建文件</h3><button value="cancel" class="icon-btn">×</button></div>
    <label>选择模板<select id="docTemplate" required></select></label>
    <label>俄文标题<input id="docTitleRu" required></label>
    <label>中文标题<input id="docTitleZh" required></label>
    <fieldset><legend>发放对象</legend>
      <div class="row"><button type="button" id="selectAllUsers" class="ghost small">全选</button><button type="button" id="clearUsers" class="ghost small">清空</button></div>
      <div id="recipientList" class="check-list"></div>
    </fieldset>
    <div class="dialog-actions"><button value="cancel" class="ghost">取消</button><button id="createDocConfirm" value="default" class="primary">创建并发放</button></div>
  </form>
</dialog>

<dialog id="assignDialog">
  <form method="dialog" class="dialog-card">
    <div class="dialog-head"><h3>调整发放对象</h3><button value="cancel" class="icon-btn">×</button></div>
    <div id="assignRecipientList" class="check-list"></div>
    <div class="dialog-actions"><button value="cancel" class="ghost">取消</button><button id="saveAssignments" value="default" class="primary">保存</button></div>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
