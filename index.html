<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=yes">
<title>FUTURE HEALTH</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="loginView" class="center-shell hidden">
  <div class="login-card">
    <div class="login-lang-row"><button id="loginLangBtn" type="button" class="ghost">中文 / RU</button></div>
    <img src="future-health-logo.png" alt="FUTURE HEALTH" class="login-logo">
    <h1 id="loginTitle">文件系统</h1>
    <form id="loginForm">
      <label><span class="label-head"><span id="loginIdLabel">个人编号</span><small id="loginIdHint" class="inline-hint">请输入手机号</small></span><input id="loginId" inputmode="numeric" autocomplete="username" required placeholder="8XXXXXXXXXX"></label>
      <label><span id="loginPasswordLabel">密码</span><input id="password" type="password" autocomplete="current-password" required></label>
      <button id="loginSubmitBtn" class="primary wide" type="submit">登录</button>
    </form>
    <button id="openRegisterBtn" type="button" class="ghost wide register-entry">注册</button>
    <p id="loginHelp" class="login-help">忘记密码？请联系管理员，管理员可将密码恢复为初始密码 12345678。</p>
    <div id="loginError" class="error hidden"></div>
  </div>
</div>

<div id="appView" class="app hidden">
  <header class="topbar">
    <div class="brand-wrap"><img src="future-health-logo.png" alt="FUTURE HEALTH" class="top-logo"><div id="who" class="muted"></div></div>
    <div class="top-actions">
      <button id="changeMyPasswordBtn" type="button" class="ghost">修改密码</button>
      <button id="toggleLang" type="button" class="ghost">中文 / RU</button>
      <button id="logoutBtn" type="button" class="ghost">退出</button>
    </div>
  </header>

  <main>
    <section id="userHome" class="panel">
      <div class="section-head"><div><h2 id="myDocsTitle">我的文件</h2><p id="myDocsHint" class="muted">只显示分配给您的文件。</p></div></div>
      <div id="userDocs" class="grid"></div>
      <div id="userEmpty" class="empty hidden">目前没有文件。</div>
    </section>

    <section id="adminHome" class="hidden">
      <nav class="admin-tabs">
        <button type="button" data-tab="templates" class="active" id="tabTemplatesBtn">模板</button>
        <button type="button" data-tab="documents" id="tabDocumentsBtn">文件</button>
        <button type="button" data-tab="users" id="tabUsersBtn">账户</button>
      </nav>

      <section id="tab-templates" class="panel admin-tab">
        <div class="section-head">
          <div><h2 id="templatesTitle">模板管理</h2><p id="templatesHint" class="muted">可导入、替换、新增或删除模板。</p></div>
          <button id="newTemplateBtn" type="button" class="primary">＋ 添加模板</button>
        </div>
        <div id="templateList"></div>
      </section>

      <section id="tab-documents" class="panel admin-tab hidden">
        <div id="fileRequestsBox" class="pending-box hidden"></div>
        <div class="section-head">
          <div><h2 id="documentsTitle">文件管理</h2><p id="documentsHint" class="muted">创建、复制、发放、收回或删除文件。管理员查看时为只读模式。</p></div>
          <button id="newDocBtn" type="button" class="primary">＋ 新建文件</button>
        </div>
        <div id="adminDocs"></div>
      </section>

      <section id="tab-users" class="panel admin-tab hidden">
        <div id="pendingRegistrationsBox" class="pending-box hidden"></div>
        <div class="section-head">
          <div><h2 id="usersTitle">账户</h2><p id="usersHint" class="muted">可修改账户名称并重置密码。</p></div>
          <button id="newUserBtn" type="button" class="primary">＋ 新建账户</button>
        </div>
        <div id="userList"></div>
      </section>
    </section>
  </main>
</div>

<dialog id="registerDialog"><div class="dialog-card">
  <div class="dialog-head"><h3 id="registerTitle">注册</h3><button type="button" class="icon-btn" data-close-dialog="registerDialog">×</button></div>
  <label><span id="registerNameLabel">姓名</span><input id="registerName" autocomplete="name" placeholder="Иванов Иван Иванович"></label>
  <label><span id="registerPhoneLabel">手机号码 / Телефон</span><input id="registerPhone" inputmode="numeric" maxlength="11" autocomplete="tel" placeholder="8XXXXXXXXXX"></label>
  <label><span id="registerPasswordLabel">密码</span><input id="registerPassword" type="password" minlength="8" autocomplete="new-password"></label>
  <label><span id="registerPassword2Label">确认密码</span><input id="registerPassword2" type="password" minlength="8" autocomplete="new-password"></label>
  <div id="registerHint" class="muted">个人编号使用您的 11 位手机号码，必须以 8 或 1 开头。</div>
  <div id="registerError" class="error hidden"></div>
  <div id="registerSuccess" class="notice hidden"></div>
  <div class="dialog-actions"><button type="button" class="ghost" data-close-dialog="registerDialog" id="registerCancelBtn">取消</button><button type="button" id="registerConfirmBtn" class="primary">注册</button></div>
</div></dialog>

<dialog id="userDialog"><div class="dialog-card" id="userForm">
  <div class="dialog-head"><h3 id="newUserTitle">新建账户</h3><button type="button" class="icon-btn" data-close-dialog="userDialog">×</button></div>
  <label><span id="newUserIdLabel">个人编号</span><input id="newEmployeeCode" inputmode="numeric" maxlength="11" autocomplete="off" required placeholder="8XXXXXXXXXX"></label>
  <label><span id="newUserRuLabel">俄文姓名</span><input id="newNameRu" autocomplete="off" placeholder="Моряхина Анна Владимировна"></label>
  <label><span id="newUserZhLabel">中文姓名</span><input id="newNameZh" autocomplete="off" placeholder="莫里亚希娜·安娜·弗拉基米罗夫娜"></label>
  <div id="newUserNotice" class="notice">新账户统一使用初始密码：<strong>12345678</strong></div>
  <div id="userCreateError" class="error hidden"></div>
  <div class="dialog-actions"><button type="button" class="ghost" data-close-dialog="userDialog" id="newUserCancelBtn">取消</button><button type="button" id="createUserConfirm" class="primary">创建账户</button></div>
</div></dialog>

<dialog id="editUserDialog"><div class="dialog-card">
  <div class="dialog-head"><h3 id="editUserTitle">账户管理</h3><button type="button" class="icon-btn" data-close-dialog="editUserDialog">×</button></div>
  <input id="editUserId" type="hidden">
  <div class="notice" id="editUserCode"></div>
  <label><span id="editRuLabel">俄文姓名</span><input id="editNameRu" autocomplete="off"></label>
  <label><span id="editZhLabel">中文姓名</span><input id="editNameZh" autocomplete="off"></label>
  <div class="dialog-actions"><button type="button" id="saveUserProfile" class="primary">保存账户名称</button></div>
  <hr class="sep">
  <div id="resetPasswordNotice" class="notice">忘记密码时，可恢复为初始密码 <strong>12345678</strong>。</div>
  <div class="dialog-actions"><button type="button" id="resetPasswordBtn" class="ghost">恢复初始密码 12345678</button></div>
  <hr class="sep">
  <button type="button" id="deleteUserBtn" class="danger wide">删除这个账户</button>
</div></dialog>

<dialog id="changePasswordDialog"><div class="dialog-card">
  <div class="dialog-head"><h3 id="changePasswordTitle">修改密码</h3><button type="button" class="icon-btn" data-close-dialog="changePasswordDialog">×</button></div>
  <label><span id="myNewPasswordLabel">新密码</span><input id="myNewPassword" type="password" minlength="8" autocomplete="new-password"></label>
  <label><span id="myNewPassword2Label">再次输入新密码</span><input id="myNewPassword2" type="password" minlength="8" autocomplete="new-password"></label>
  <div id="myPasswordError" class="error hidden"></div>
  <div class="dialog-actions"><button type="button" class="ghost" data-close-dialog="changePasswordDialog" id="changePasswordCancelBtn">取消</button><button type="button" id="saveMyPassword" class="primary">保存新密码</button></div>
</div></dialog>

<dialog id="templateDialog"><div class="dialog-card">
  <div class="dialog-head"><h3 id="newTemplateTitle">添加新模板</h3><button type="button" class="icon-btn" data-close-dialog="templateDialog">×</button></div>
  <label><span id="templateZhLabel">中文标题</span><input id="templateTitleZh" placeholder="新申请书"></label>
  <label><span id="templateRuLabel">俄文标题</span><input id="templateTitleRu" placeholder="Новое заявление"></label>
  <label><span id="templateFileLabel">模板源代码</span><input id="templateSourceFile" type="file" accept=".txt,.html,text/plain,text/html"></label>
  <div id="templateHint" class="muted">新模板保存后可在“新建文件”时选择。</div>
  <div id="templateCreateError" class="error hidden"></div>
  <div class="dialog-actions"><button type="button" class="ghost" data-close-dialog="templateDialog" id="templateCancelBtn">取消</button><button type="button" id="createTemplateConfirm" class="primary">添加模板</button></div>
</div></dialog>

<dialog id="docDialog"><div class="dialog-card" id="docForm">
  <div class="dialog-head"><h3 id="newDocTitle">新建文件</h3><button type="button" class="icon-btn" data-close-dialog="docDialog">×</button></div>
  <label><span id="selectTemplateLabel">选择模板</span><select id="docTemplate"></select></label>
  <label><span id="docRuTitleLabel">俄文标题</span><input id="docTitleRu"></label>
  <label><span id="docZhTitleLabel">中文标题</span><input id="docTitleZh"></label>
  <fieldset><legend id="recipientsLegend">发放对象</legend><div class="row"><button type="button" id="selectAllUsers" class="ghost small">全选</button><button type="button" id="clearUsers" class="ghost small">清空</button></div><div id="recipientList" class="check-list"></div></fieldset>
  <div class="dialog-actions"><button type="button" class="ghost" data-close-dialog="docDialog" id="docCancelBtn">取消</button><button type="button" id="createDocConfirm" class="primary">创建并发放</button></div>
</div></dialog>

<dialog id="assignDialog"><div class="dialog-card">
  <div class="dialog-head"><h3 id="assignTitle">调整发放对象</h3><button type="button" class="icon-btn" data-close-dialog="assignDialog">×</button></div>
  <div id="assignRecipientList" class="check-list"></div>
  <div class="dialog-actions"><button type="button" class="ghost" data-close-dialog="assignDialog" id="assignCancelBtn">取消</button><button type="button" id="saveAssignments" class="primary">保存</button></div>
</div></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body></html>
