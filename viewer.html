<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FUTURE HEALTH</title>
<style>body{font-family:system-ui;background:#eef2f7;margin:0;padding:40px;text-align:center;color:#17324d}.box{max-width:560px;margin:15vh auto;background:#fff;padding:28px;border-radius:22px;box-shadow:0 8px 28px rgba(0,0,0,.08)}.err{color:#b42318}</style></head>
<body><div class="box" id="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
(async()=>{
 const cfg=window.APP_CONFIG,sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
 const uiLang=(localStorage.getItem('fh_ui_lang')||localStorage.getItem('fb_ui_lang')||'zh')==='ru'?'ru':'zh';
 const txt=uiLang==='zh'?{opening:'正在验证权限并打开文件…',missing:'缺少文件编号。',denied:'没有权限查看此文件，或文件不存在。',nosource:'该文件尚未导入原始源代码。',backAdmin:'返回',backUser:'返回',readonly:'管理员只读查看',bottomUser:'退出文件，返回文件列表'}:{opening:'Проверка доступа и открытие документа…',missing:'Не указан номер документа.',denied:'Нет доступа к документу или документ не существует.',nosource:'Исходный код этого документа ещё не загружен.',backAdmin:'Назад',backUser:'Назад',readonly:'Просмотр администратора: только чтение',bottomUser:'Выйти из документа и вернуться к списку'};
 document.documentElement.lang=uiLang==='zh'?'zh-CN':'ru';document.getElementById('status').textContent=txt.opening;
 const qs=new URLSearchParams(location.search),id=qs.get('id'),requestedAdmin=qs.get('mode')==='admin';
 const {data:{session}}=await sb.auth.getSession(); if(!session){location.replace('./');return}
 if(!id){document.getElementById('status').innerHTML='<span class="err">'+txt.missing+'</span>';return}
 let adminMode=false;
 if(requestedAdmin){const {data:p}=await sb.from('profiles').select('is_admin').eq('id',session.user.id).single();adminMode=!!p?.is_admin}
 const {data,error}=await sb.from('documents').select('id,source_html,title_ru,title_zh').eq('id',id).single();
 if(error||!data){document.getElementById('status').innerHTML='<span class="err">'+txt.denied+'</span>';return}
 if(!data.source_html){document.getElementById('status').innerHTML='<span class="err">'+txt.nosource+'</span>';return}
 const fallback=adminMode?'./#documents':'./';
 const backAction=`location.href='${fallback}'`;
 const nav=`<style id="fh-system-style">
 .fh-system-nav{position:fixed;left:10px;top:10px;z-index:2147483647;display:flex;gap:8px;align-items:center;font-family:system-ui,-apple-system,sans-serif}
 .fh-system-nav button{border:0;border-radius:999px;padding:9px 13px;background:#0b4f86;color:#fff;font-size:13px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.18);cursor:pointer}.fh-lang-toggle{border:0;border-radius:999px;padding:8px 14px;background:#0b4f86;color:#fff;font-size:13px;font-weight:700;cursor:pointer;margin-left:8px}
 .fh-readonly-badge{background:#fff3cd;color:#7a5200;border:1px solid #f0cc6a;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:700}
 ${adminMode?'.smart-form,.submission-section,.signature-area,#formHeading,#fillInfoLabel,#completionMessage,.footnote{display:none!important}':''}
 </style><div class="fh-system-nav"><button type="button" onclick="${backAction}">← ${adminMode?txt.backAdmin:txt.backUser}</button>${adminMode?`<span class="fh-readonly-badge">${txt.readonly}</span>`:''}</div>`;
 const bottom=`<div style="max-width:680px;width:calc(100% - 24px);margin:18px auto 30px;text-align:center;font-family:system-ui"><button type="button" onclick="${backAction}" style="border:0;border-radius:999px;padding:12px 22px;background:#0b4f86;color:#fff;font-weight:700;font-size:14px;cursor:pointer">← ${adminMode?txt.backAdmin:txt.bottomUser}</button></div>`;
 let html=data.source_html;
 html=html.replace(/<body([^>]*)>/i,m=>m+nav);
 html=html.replace(/<\/body>/i,bottom+'</body>');
 document.open();document.write(html);document.close();
 setTimeout(()=>{const sel=document.getElementById('languageSelect');if(sel){sel.style.display='none';const lbl=document.getElementById('languageLabel');if(lbl)lbl.style.display='none';let btn=document.getElementById('fhLangToggle');if(!btn){btn=document.createElement('button');btn.type='button';btn.id='fhLangToggle';btn.className='fh-lang-toggle';sel.parentElement?.appendChild(btn)}const sync=()=>{btn.textContent=sel.value==='zh'?'RU':'中文'};sync();btn.onclick=()=>{sel.value=sel.value==='zh'?'ru':'zh';sel.dispatchEvent(new Event('change',{bubbles:true}));setTimeout(sync,0)}}},120);
 if(adminMode){setTimeout(()=>{document.querySelectorAll('input,textarea,select,button').forEach(el=>{if(el.closest('.fh-system-nav')||el.id==='fhLangToggle')return;if(el.id==='languageSelect'||el.id==='refreshBtn'||el.id==='refreshPageBtn')return;el.disabled=true;});},180)}
})();
</script></body></html>
