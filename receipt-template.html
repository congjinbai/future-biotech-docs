let currentLang=localStorage.getItem('receiptLanguage')==='zh'?'zh':'ru';const t=()=>I[currentLang];
function parseDate(v){const d=String(v).replace(/\D/g,'');if(!/^\d{8}$/.test(d))return null;const day=+d.slice(0,2),m=+d.slice(2,4),y=+d.slice(4),dt=new Date(y,m-1,day);if(y<1900||y>2100||dt.getFullYear()!==y||dt.getMonth()!==m-1||dt.getDate()!==day)return null;return{ru:`${day} ${monthsRu[m-1]} ${y} г.`,zh:`${y}年${m}月${day}日`}}
function formatInput(q,v){if(q.type==='date'){const d=String(v).replace(/\D/g,'').slice(0,8);return d.length<=2?d:d.length<=4?`${d.slice(0,2)}.${d.slice(2)}`:`${d.slice(0,2)}.${d.slice(2,4)}.${d.slice(4)}`}if(q.type==='phone'||q.type==='number')return String(v).replace(/\D/g,'');return String(v)}

function renderPreview(){const pRu=(CFG.paragraphs_ru||[]).map(x=>`<p>${renderTokenText(x,'ru',true)}</p>`).join(''),pZh=(CFG.paragraphs_zh||[]).map(x=>`<p>${renderTokenText(x,'zh',true)}</p>`).join('');const passRu=CFG.passport_enabled===false?'':`<p>Я, <strong>${esc(nameRu)}</strong>, паспорт серия <strong>${esc(CFG.passport_series||'')}</strong> № <strong>${esc(CFG.passport_number||'')}</strong>, выдан <strong>${esc(CFG.passport_issuer_ru||'')}</strong>.</p>`;const passZh=CFG.passport_enabled===false?'':`<p>本人 <strong>${esc(nameZh)}</strong>，护照：系列 <strong>${esc(CFG.passport_series||'')}</strong>，编号 <strong>${esc(CFG.passport_number||'')}</strong>，签发机关：<strong>${esc(CFG.passport_issuer_zh||'')}</strong>。</p>`;$('previewRu').innerHTML=`<section><p class="center title">${esc(CFG.doc_title_ru||'Расписка')}</p>${passRu}<p>${esc(CFG.amount_intro_ru||'Получил(а) денежные средства в общей сумме')} <strong>${esc(CFG.amount_num||'')}</strong> ${esc(CFG.currency_ru||'рублей')}.</p><p>${esc(CFG.amount_words_label_ru||'Сумма прописью:')} <strong>${esc(CFG.amount_words_ru||'')}</strong>.</p>${pRu}</section><div style="margin-top:20px"><p>Дата: <span class="placeholder">${todayRu()}</span></p><div style="margin-top:12px;display:flex;align-items:flex-end;white-space:nowrap"><span>${esc(CFG.signature_label_ru||'Подпись сотрудника:')}&nbsp;</span><span style="flex:1;border-bottom:1px solid #111;height:1.3em"></span></div></div>`;$('previewZh').innerHTML=`<section><p class="center title">${esc(CFG.doc_title_zh||'收条')}</p>${passZh}<p>${esc(CFG.amount_intro_zh||'今收到现金总金额：')}<strong>${esc(CFG.amount_num_zh||CFG.amount_num||'')}</strong>${esc(CFG.currency_zh||'卢布')}。</p><p>${esc(CFG.amount_words_label_zh||'大写：')}<strong>${esc(CFG.amount_words_zh||'')}</strong>。</p>${pZh}</section><div style="margin-top:20px"><p>日期：<span class="placeholder">${todayZh()}</span></p><div style="margin-top:12px;display:flex;align-items:flex-end;white-space:nowrap"><span>${esc(CFG.signature_label_zh||'员工签字：')}&nbsp;</span><span style="flex:1;border-bottom:1px solid #111;height:1.3em"></span></div></div>`}
function requiredOk(){return qlist.every(q=>!q.required||String(values[q.key]||'').trim())}
function render(){const q=qlist[index],x=t();if(!q){$('smartQuestion').textContent=x.done;return}$('smartQuestion').textContent=`${index+1}. ${currentLang==='ru'?(q.question_ru||q.label_ru||q.key):(q.question_zh||q.label_zh||q.key)}`;$('smartHint').textContent=currentLang==='ru'?(q.hint_ru||''):(q.hint_zh||'');$('smartInput').value=values[q.key]||'';$('smartInput').placeholder=currentLang==='ru'?(q.placeholder_ru||(q.type==='date'?'ДД.ММ.ГГГГ':'')):(q.placeholder_zh||(q.type==='date'?'日.月.年':''));$('smartInput').inputMode=(q.type==='date'||q.type==='phone'||q.type==='number')?'numeric':'text';$('smartNextBtn').textContent=index===qlist.length-1?x.done:x.next;$('smartError').textContent='';renderProgress();setTimeout(()=>$('smartInput').focus(),0)}

function submit(){const q=qlist[index],v=formatInput(q,$('smartInput').value);if(q.required&&!String(v).trim()){$('smartError').textContent=t().required;return}if(q.type==='date'&&v&&!parseDate(v)){$('smartError').textContent=t().invalidDate;return}if(q.type==='phone'&&v&&!/^\d{6,15}$/.test(v)){$('smartError').textContent=t().invalidPhone;return}values[q.key]=v;renderPreview();if(index<qlist.length-1){index++;render()}else if(requiredOk()){$('smartQuestion').textContent=t().done;$('smartHint').textContent='';$('smartInput').disabled=true;$('smartNextBtn').disabled=true;$('completionMessage').classList.add('visible');$('submissionSection').classList.add('visible');$('printDocBtn').disabled=false;$('onlineSignBtn').disabled=false;renderProgress();setTimeout(()=>window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}),100)}}

function activeSig(){return signatureStore[currentLang]}function resizeCanvas(){const r=canvas.getBoundingClientRect();canvas.width=r.width||500;canvas.height=r.height||300;ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);const s=activeSig();if(s.data){const img=new Image();img.onload=()=>ctx.drawImage(img,0,0,canvas.width,canvas.height);img.src=s.data}}
function coords(e){const r=canvas.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return{x:(t.clientX-r.left)*(canvas.width/r.width),y:(t.clientY-r.top)*(canvas.height/r.height)}}function start(e){e.preventDefault();drawing=true;const p=coords(e);lastX=p.x;lastY=p.y}function move(e){e.preventDefault();if(!drawing)return;const p=coords(e);ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(p.x,p.y);ctx.strokeStyle='#1a5bb5';ctx.lineWidth=5;ctx.lineCap='round';ctx.stroke();lastX=p.x;lastY=p.y;activeSig().data='drawing';activeSig().confirmed=false;$('confirmSignatureBtn').disabled=false;$('createImageBtn').disabled=true}function end(e){e.preventDefault();if(drawing){drawing=false;activeSig().data=canvas.toDataURL('image/png')}}
['mousedown','touchstart'].forEach(x=>canvas.addEventListener(x,start,{passive:false}));['mousemove','touchmove'].forEach(x=>canvas.addEventListener(x,move,{passive:false}));['mouseup','mouseleave','touchend','touchcancel'].forEach(x=>canvas.addEventListener(x,end,{passive:false}));
$('clearSignatureBtn').onclick=()=>{ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);signatureStore[currentLang]={data:null,confirmed:false};$('confirmSignatureBtn').disabled=true;$('createImageBtn').disabled=true};$('confirmSignatureBtn').onclick=()=>{const s=activeSig();if(!s.data||s.data==='drawing')return alert(t().draw);s.confirmed=true;$('createImageBtn').disabled=false};$('onlineSignBtn').onclick=()=>{$('signatureArea').classList.toggle('visible');if($('signatureArea').classList.contains('visible'))setTimeout(()=>{resizeCanvas();$('signatureArea').scrollIntoView({behavior:'smooth'})},100)};
function sideHtml(lang){const isRu=lang==='ru',paras=(isRu?CFG.paragraphs_ru:CFG.paragraphs_zh)||[],name=isRu?nameRu:nameZh,title=isRu?(CFG.doc_title_ru||'Расписка'):(CFG.doc_title_zh||'收条'),pass=CFG.passport_enabled===false?'':isRu?`<p>Я, <b>${esc(name)}</b>, паспорт серия <b>${esc(CFG.passport_series||'')}</b> № <b>${esc(CFG.passport_number||'')}</b>, выдан <b>${esc(CFG.passport_issuer_ru||'')}</b>.</p>`:`<p>本人 <b>${esc(name)}</b>，护照：系列 <b>${esc(CFG.passport_series||'')}</b>，编号 <b>${esc(CFG.passport_number||'')}</b>，签发机关：<b>${esc(CFG.passport_issuer_zh||'')}</b>。</p>`,amount=isRu?`<p>${esc(CFG.amount_intro_ru||'Получил(а) денежные средства в общей сумме')} <b>${esc(CFG.amount_num||'')}</b> ${esc(CFG.currency_ru||'рублей')}.</p><p>${esc(CFG.amount_words_label_ru||'Сумма прописью:')} <b>${esc(CFG.amount_words_ru||'')}</b>.</p>`:`<p>${esc(CFG.amount_intro_zh||'今收到现金总金额：')}<b>${esc(CFG.amount_num_zh||CFG.amount_num||'')}</b>${esc(CFG.currency_zh||'卢布')}。</p><p>${esc(CFG.amount_words_label_zh||'大写：')}<b>${esc(CFG.amount_words_zh||'')}</b>。</p>`;return `<p style="text-align:center;font-size:20px;font-weight:bold;margin-bottom:18px">${esc(title)}</p>${pass}${amount}${paras.map(x=>`<p>${renderTokenText(x,lang,true)}</p>`).join('')}`}
function buildPage(includeSigs=false){const page=document.createElement('div');page.style.cssText="position:fixed;left:-10000px;top:0;width:794px;height:1123px;padding:48px 42px;box-sizing:border-box;background:#fff;overflow:hidden;font-family:'Times New Roman','Noto Serif CJK SC','Songti SC',serif;font-size:13.2px;line-height:1.42;color:#000";const sru=includeSigs&&signatureStore.ru.confirmed?signatureStore.ru.data:null,szh=includeSigs&&signatureStore.zh.confirmed?signatureStore.zh.data:null;page.innerHTML=`<div style="display:grid;grid-template-columns:1fr 1fr;column-gap:28px;align-items:start"><section>${sideHtml('ru')}</section><section>${sideHtml('zh')}</section></div><div style="display:grid;grid-template-columns:1fr 1fr;column-gap:28px;margin-top:34px;align-items:start"><section><p>Дата: <b>${todayRu()}</b></p><div style="margin-top:18px;display:flex;align-items:flex-end;white-space:nowrap"><span>${esc(CFG.signature_label_ru||'Подпись сотрудника:')}&nbsp;</span><div style="position:relative;flex:1;min-width:170px;height:96px;border-bottom:1px solid #000">${sru?`<img src="${sru}" style="position:absolute;left:50%;bottom:-4px;transform:translateX(-50%);max-width:230px;width:auto;height:104px;object-fit:contain">`:''}</div></div></section><section><p>日期：<b>${todayZh()}</b></p><div style="margin-top:18px;display:flex;align-items:flex-end;white-space:nowrap"><span>${esc(CFG.signature_label_zh||'员工签字：')}&nbsp;</span><div style="position:relative;flex:1;min-width:170px;height:96px;border-bottom:1px solid #000">${szh?`<img src="${szh}" style="position:absolute;left:50%;bottom:-4px;transform:translateX(-50%);max-width:230px;width:auto;height:104px;object-fit:contain">`:''}</div></div></section></div>`;page.querySelectorAll('p').forEach(p=>{if(!p.style.margin)p.style.margin='5px 0'});return page}
function renderPage(page){document.body.appendChild(page);return html2canvas(page,{scale:2,useCORS:true,backgroundColor:'#fff',width:794,height:1123,windowWidth:794,windowHeight:1123}).finally(()=>page.remove())}function pdfFrom(data,w){const img=new Image();img.onload=()=>{const {jsPDF}=window.jspdf,pdf=new jsPDF({orientation:'portrait',unit:'pt',format:'a4'});pdf.addImage(data,'PNG',0,0,595.28,841.89);const blob=pdf.output('blob'),url=URL.createObjectURL(blob);w.location.replace(url);setTimeout(()=>URL.revokeObjectURL(url),180000)};img.src=data}
$('printDocBtn').onclick=()=>{const w=window.open('','_blank');if(!w)return alert(t().popup);w.document.write(`<p style="text-align:center;padding:40px;font-family:Arial">${t().loading}</p>`);renderPage(buildPage(false)).then(c=>pdfFrom(c.toDataURL('image/png'),w)).catch(()=>{w.close();alert(t().pdfError)})};$('createImageBtn').onclick=()=>{if(!activeSig().confirmed)return alert(t().confirmAlert);renderPage(buildPage(true)).then(c=>{currentImageData=c.toDataURL('image/png');$('imageContainer').innerHTML=`<img src="${currentImageData}" alt="document">`;$('pageSecond').classList.add('visible');$('pageFirst').style.display='none';scrollTo(0,0)})};$('backToFormBtn').onclick=()=>{$('pageSecond').classList.remove('visible');$('pageFirst').style.display='block';scrollTo(0,0)};$('shareImageBtn').onclick=async()=>{if(!currentImageData)return;const blob=await(await fetch(currentImageData)).blob(),file=new File([blob],'FUTURE_HEALTH_document.png',{type:'image/png'});if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]})))navigator.share({title:CFG.doc_title_ru||'FUTURE HEALTH',files:[file]}).catch(()=>{});else{const a=document.createElement('a');a.href=currentImageData;a.download=file.name;a.click()}};$('printImageBtn').onclick=()=>{if(!currentImageData)return;const w=window.open('','_blank');if(!w)return alert(t().popup);pdfFrom(currentImageData,w)};
$('languageSelect').onchange=e=>{currentLang=e.target.value;localStorage.setItem('receiptLanguage',currentLang);applyLanguage();if($('signatureArea').classList.contains('visible'))resizeCanvas()};$('refreshBtn').onclick=()=>location.reload();renderPreview();applyLanguage();resizeCanvas();
})();
